version: scenario-catalog-v2
lab_only: true
campaign_design:
  version: supplemental-design-v1
  campaign_id: SUPPLEMENTAL-20261122
  candidate_tag: supplemental-collection-v1.0.0-candidate.1
  scope: Controlled four-VM lab activity profiles; assisted research, not malicious
    intent or general C2 detection.
  evaluation_protocol: known-template-new-host-day
  raw_feature_schema: features-v3
  derived_feature_schema: features-v5-http-v1
  automation_eligible: false
  partition_contexts:
    train: 10
    validation: 4
    locked_test: 4
  repetitions_per_label: 3
  maximum_attempts_per_run: 3
  minimum_host_days_per_partition: 3
  dependency_block: casefolded-host-and-utc-date
  http_endpoint: http://10.40.0.10:8081/beacon
  windows_host: WIN11-TARGET
  templates:
    account:
    - id: account-recovery
      benign: ACCOUNT-BENIGN-TWO-TYPOS-THEN-SUCCESS
      malicious: ACCOUNT-MALICIOUS-BURST-THEN-SUCCESS
    - id: account-sessions
      benign: ACCOUNT-BENIGN-REMOTE-SESSIONS
      malicious: ACCOUNT-MALICIOUS-REPEATED-FAILURES-6
    - id: account-maintenance
      benign: ACCOUNT-BENIGN-MULTIACCOUNT-MAINTENANCE
      malicious: ACCOUNT-MALICIOUS-PASSWORD-SPRAY
    - id: account-retries
      benign: ACCOUNT-BENIGN-STALE-CREDENTIAL
      malicious: ACCOUNT-MALICIOUS-RAPID-GUESSING
    - id: account-multiuser
      benign: ACCOUNT-BENIGN-MULTIACCOUNT-RECOVERY
      malicious: ACCOUNT-MALICIOUS-MULTIACCOUNT-GUESSING
    c2:
    - id: tcp-poll
      benign: C2-BENIGN-HEALTH-POLL
      malicious: C2-MALICIOUS-HTTP-BEACON
    - id: tcp-transfer
      benign: C2-BENIGN-SINGLE-DOWNLOAD
      malicious: C2-MALICIOUS-STAGED-TRANSFER
    - id: tcp-api
      benign: C2-BENIGN-IRREGULAR-API
      malicious: C2-MALICIOUS-JITTER-BEACON
    - id: tcp-retry
      benign: C2-BENIGN-API-BURST
      malicious: C2-MALICIOUS-STAGED-TRANSFER-RETRY
design_sha256: 3fd9da699ebe2f240083f1c3d9e8f19069d46c994db0b3b5e28b558091006a74
template_definitions:
  account-recovery:benign:
    scenario_id: ACCOUNT-BENIGN-TWO-TYPOS-THEN-SUCCESS
    family: account
    label: benign
    purpose: trainable
    cohort_id: ACCOUNT-PAIR-01
    expected_behavior: 'Authorized recovery/maintenance: 2 failed and 1 successful
      console authentications; exact account/order/cadence are frozen in execution_profile.'
    execution_profile:
      transport: console
      accounts_csv: datn_lab01
      attempts_csv: datn_lab01:fail,datn_lab01:fail,datn_lab01:success
      base_intervals_seconds: 20,20
      expected_action_count: 3
    attribution:
      account_names:
      - datn_lab01
      process_names: []
      source_ips: []
      destination_ips: []
      destination_ports: []
      dns_suffixes: []
      command_contains_any: []
      logon_types:
      - 2
    quality_gates:
      min_account_failures: 2
      max_account_failures: 2
      min_account_successes: 1
      max_account_successes: 1
      require_success_after_failure: true
      require_all_accounts_observed: false
      min_process_events: 0
      min_network_events: 0
      min_dns_events: 0
      min_suricata_events: 0
      required_suricata_signature_ids: []
      forbidden_suricata_signature_ids: []
    preconditions:
    - Use only disposable datn_lab01/datn_lab02/datn_lab03 accounts on WIN11-TARGET;
      same accounts serve both labels.
    - Freeze an AVAILABLE as-of baseline before either cohort member. Restore the
      same baseline/context condition before each repetition.
    - Record the lab lockout policy and verify sufficient attempts are possible; never
      change production authentication policy.
    execution_steps:
    - Execute the frozen attempts_csv in order, using the frozen intervals between
      action starts; incorrect passwords must be known-wrong lab values.
    - For SMB, close each connection/session before the next action so cached credentials
      do not suppress events. For console successes, sign out before the next action.
    - Record actual receipts; any extra/missing authentication event or missed timing
      deadline invalidates the run.
    expected_observables:
    - Exact 4624/4625 counts and declared accounts/logon type; observed feature vector
      must agree with full-bucket online replay.
    cleanup_steps:
    - Close lab sessions, verify accounts are unlocked and restore the documented
      baseline before the next run.
    template_id: account-recovery
