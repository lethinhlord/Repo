  -
    scenario_id: "C2-BENIGN-HEALTH-POLL"
    family: "c2"
    label: "benign"
    purpose: "trainable"
    cohort_id: "C2-PAIR-01"
    expected_behavior: "Authorized lab activity profile: 8 HTTP actions at frozen gaps [25, 25, 25, 25, 25, 25, 25] seconds. Same endpoint, identity and harmless response as the opposite-label cohort member; label denotes this lab profile, not inferable real-world intent."
    execution_profile:
      transport: "http"
      base_intervals_seconds: "25,25,25,25,25,25,25"
      expected_action_count: 8
      endpoint: "http://10.40.0.10:8081/beacon"
    attribution:
      process_names:
        - "curl.exe"
      source_ips:
        - "10.20.0.10"
      destination_ips:
        - "10.40.0.10"
      destination_ports:
        - 8081
      command_contains_any:
        - "/beacon"
    quality_gates:
      min_process_events: 8
      min_network_events: 8
      min_suricata_events: 8
      required_suricata_signature_ids:
        - 900001
    preconditions:
      - "Kali serves the same harmless fixed body at /beacon on 10.40.0.10:8081 for every HTTP scenario; DNS wildcard www.datn.test resolves to 10.40.0.10."
      - "WIN11-TARGET traffic traverses NET-SENSOR; Suricata local canary signatures are identical for both labels."
      - "Freeze an AVAILABLE as-of baseline before either cohort member; native Sysmon clocks and full-bucket parity must pass."
    execution_steps:
      - "Execute the frozen profile using scripts/run_training_http.ps1 for HTTP or scripts/run_dns_scenario.ps1 for DNS; launch one nonce-traceable child powershell.exe for DNS."
      - "HTTP uses curl.exe, one fresh connection per action, identical /beacon URI template and response content for both labels. DNS uses the same nonce-qualified unique-name format and suffix for both labels."
      - "Stop at expected_action_count; retain real action receipts and raw telemetry. Do not substitute generated feature rows."
    expected_observables:
      - "Sysmon process/network or DNS records plus matching Suricata records; identical canary signatures are evidence, never label-specific gates."
      - "All 24 features remain unchanged. Counts and cadence are measured from raw telemetry, not copied from this profile."
    cleanup_steps:
      - "Stop the runner; preserve receipts, service logs and immutable raw evidence; reset only lab context/cache as prescribed before the next run."
