version: "scenario-catalog-v1"
lab_only: true
scenarios:
  -
    scenario_id: "ACCOUNT-BENIGN-TWO-TYPOS-THEN-SUCCESS"
    family: "account"
    label: "benign"
    purpose: "trainable"
    cohort_id: "ACCOUNT-PAIR-01"
    expected_behavior: "Authorized recovery/maintenance: 2 failed and 1 successful console authentications; exact account/order/cadence are frozen in execution_profile."
    execution_profile:
      transport: "console"
      accounts_csv: "datn_lab01"
      attempts_csv: "datn_lab01:fail,datn_lab01:fail,datn_lab01:success"
      base_intervals_seconds: "20,20"
      expected_action_count: 3
    attribution:
      account_names:
        - "datn_lab01"
      logon_types:
        - 2
    quality_gates:
      min_account_failures: 2
      max_account_failures: 2
      min_account_successes: 1
      max_account_successes: 1
      require_success_after_failure: true
      require_all_accounts_observed: false
    preconditions:
      - "Use only disposable datn_lab01/datn_lab02/datn_lab03 accounts on WIN11-TARGET; same accounts serve both labels."
      - "Freeze an AVAILABLE as-of baseline before either cohort member. Restore the same baseline/context condition before each repetition."
      - "Record the lab lockout policy and verify sufficient attempts are possible; never change production authentication policy."
    execution_steps:
      - "Execute the frozen attempts_csv in order, using the frozen intervals between action starts; incorrect passwords must be known-wrong lab values."
      - "For SMB, close each connection/session before the next action so cached credentials do not suppress events. For console successes, sign out before the next action."
      - "Record actual receipts; any extra/missing authentication event or missed timing deadline invalidates the run."
    expected_observables:
      - "Exact 4624/4625 counts and declared accounts/logon type; observed feature vector must agree with full-bucket online replay."
    cleanup_steps:
      - "Close lab sessions, verify accounts are unlocked and restore the documented baseline before the next run."
