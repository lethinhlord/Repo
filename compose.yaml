services:
  api:
    image: datn-ai-soar-api:week3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VT_MODE: "${VT_MODE:-mock}"
      VT_API_KEY: "${VT_API_KEY:-}"
      VT_TIMEOUT_SECONDS: "${VT_TIMEOUT_SECONDS:-5}"
      MODEL_PACKAGE_DIR: "${MODEL_PACKAGE_DIR:-/app/ml/model-package}"
      MODEL_PACKAGE_SIGNING_KEY: "${MODEL_PACKAGE_SIGNING_KEY:?Set MODEL_PACKAGE_SIGNING_KEY in .env}"
      FEATURE_STATE_DB: "/app/state/feature-state.sqlite3"
      FEATURE_STATE_RETENTION_SECONDS: "${FEATURE_STATE_RETENTION_SECONDS:-86400}"
      INCIDENT_DB: "/app/state/incidents.sqlite3"
      MODEL_FEEDBACK_DB: "/app/state/model-feedback.sqlite3"
      MODEL_MONITORING_DB: "${MODEL_MONITORING_DB:-/app/state/model-monitoring.sqlite3}"
      NOTIFICATION_MODE: "${NOTIFICATION_MODE:-log}"
      NOTIFICATION_WEBHOOK_URL: "${NOTIFICATION_WEBHOOK_URL:-}"
      NOTIFICATION_TIMEOUT_SECONDS: "${NOTIFICATION_TIMEOUT_SECONDS:-5}"
      NOTIFICATION_LEASE_SECONDS: "${NOTIFICATION_LEASE_SECONDS:-300}"
      INGRESS_NONCE_DB: "/app/state/ingress-nonces.sqlite3"
      WAZUH_WEBHOOK_SECRET: "${WAZUH_WEBHOOK_SECRET:?Set WAZUH_WEBHOOK_SECRET in .env}"
      WAZUH_WEBHOOK_MAX_SKEW_SECONDS: "${WAZUH_WEBHOOK_MAX_SKEW_SECONDS:-300}"
      WAZUH_WEBHOOK_MAX_REQUESTS_PER_MINUTE: "${WAZUH_WEBHOOK_MAX_REQUESTS_PER_MINUTE:-300}"
    volumes:
      - ${MODEL_PACKAGE_HOST_DIR:-./ml/model-package}:/app/ml/model-package:ro
      - feature_state:/app/state
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/ready')); assert data['status']=='ready'"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - soar

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    restart: unless-stopped
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}"
      N8N_HOST: "${N8N_PUBLIC_HOST:-localhost}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_WEBHOOK_URL: "${N8N_PROTOCOL:-http}://${N8N_PUBLIC_HOST:-localhost}:5678/"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      N8N_PAYLOAD_SIZE_MAX: "2"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - soar

volumes:
  n8n_data:
  feature_state:

networks:
  soar:
    name: datn-week2-soar
