services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: datn-ai-soar-api:week3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VT_MODE: "${VT_MODE:-mock}"
      VT_API_KEY: "${VT_API_KEY:-}"
      VT_TIMEOUT_SECONDS: "${VT_TIMEOUT_SECONDS:-5}"
      MODEL_PACKAGE_DIR: "${MODEL_PACKAGE_DIR:-}"
      FEATURE_STATE_DB: "/app/state/feature-state.sqlite3"
      FEATURE_STATE_RETENTION_SECONDS: "${FEATURE_STATE_RETENTION_SECONDS:-86400}"
    volumes:
      - ./ml/model-package:/app/ml/model-package:ro
      - feature_state:/app/state
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - soar

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}"
      N8N_HOST: "${N8N_PUBLIC_HOST:-localhost}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      WEBHOOK_URL: "http://${N8N_PUBLIC_HOST:-localhost}:5678/"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - soar

volumes:
  n8n_data:
  feature_state:

networks:
  soar:
    name: datn-week2-soar
